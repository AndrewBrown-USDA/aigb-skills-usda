name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI help
        run: node bin/skills.js --help

      - name: Validate packaged skills
        run: npm run validate:skills -- --report .scratch/skills-report.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned skills-ref
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"

      - name: Validate Agent Skills format
        run: |
          for skill_dir in skills/*/; do
            skills-ref validate "$skill_dir"
          done

      - name: Run packaged skill tests
        run: npm run test:skills

      - name: Upload packaged skill validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-skill-validation-node-${{ matrix.node-version }}
          path: .scratch/skills-report.json
          if-no-files-found: warn
